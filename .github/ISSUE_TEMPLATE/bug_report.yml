name: Bug report
description: Report unexpected behavior in discovery, configuration, or the TUI.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal example directory structure or config. Remove private contents and paths.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, Go version, editor, and how you installed agent-rules.
    validations:
      required: true
